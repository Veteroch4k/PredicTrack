spring:
  application:
    name: logistics
  datasource:
    url: jdbc:postgresql://localhost:5432/logistics_db
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.spatial.dialect.postgis.PostgisDialect # Важно для PostGIS
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: logistics-group
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"